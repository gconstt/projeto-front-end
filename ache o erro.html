// === RENDER ===
const container = document.getElementById('exercicios');
const totalEl = document.getElementById('total');
const resolvidosEl = document.getElementById('resolvidos');
totalEl.textContent = exercicios.length;
let resolvidos = 0;
const tentativasPorEx = {};

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

exercicios.forEach(ex => {
  tentativasPorEx[ex.numero] = 0;

  const div = document.createElement('div');
  div.className = 'exercicio';
  div.dataset.numero = ex.numero;

  const saidaLabel = ex.saidaEsperada === ""
    ? "<b>Saida esperada:</b> <em>(nenhuma saida no console)</em>"
    : "<b>Saida esperada:</b>";
  const saidaBloco = ex.saidaEsperada === ""
    ? ""
    : `<div class="saida-esperada">${escapeHtml(ex.saidaEsperada)}</div>`;

  div.innerHTML = `
    <div class="exercicio-header" onclick="toggleExercicio(this)">
      <h2><span class="status-icon">&#9744;</span> #${ex.numero} - ${ex.titulo}</h2>
      <span class="badge ${ex.dificuldade}">${ex.dificuldade}</span>
    </div>
    <div class="exercicio-body">
      <div class="tags">${ex.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="enunciado">${ex.enunciado}</div>

      <label class="label-editor">Codigo com bug (original):</label>
      <div class="codigo-bugado">${escapeHtml(ex.codigo)}</div>

      ${saidaLabel}
      ${saidaBloco}

      <label class="label-editor">Escreva o codigo corrigido:</label>
      <textarea class="editor" data-numero="${ex.numero}" spellcheck="false">${escapeHtml(ex.codigo)}</textarea>

      <div class="botoes">
        <button class="btn btn-validar" onclick="validar(${ex.numero})">Validar</button>
        <button class="btn btn-dica" onclick="toggleDica(this)">Dica</button>
        <button class="btn btn-resetar" onclick="resetar(${ex.numero})">Resetar</button>
        <button class="btn btn-resposta" data-numero="${ex.numero}" onclick="toggleResposta(this)">Ver Resposta</button>
        <span class="tentativas" data-numero="${ex.numero}"></span>
      </div>

      <div class="feedback" data-numero="${ex.numero}"></div>
      <div class="dica">${ex.dica}</div>
      <div class="resposta" data-resp-numero="${ex.numero}">
        <strong>Explicacao:</strong> ${ex.explicacao}
        <br><br><strong>Codigo corrigido:</strong>
        <div class="codigo-corrigido">${escapeHtml(ex.correcao)}</div>
      </div>
    </div>
  `;
  container.appendChild(div);
});

// Tab support in textareas
document.querySelectorAll('.editor').forEach(textarea => {
  textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var start = this.selectionStart;
      var end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 4;
    }
  });
});

function toggleExercicio(header) {
  header.parentElement.classList.toggle('aberto');
}

function toggleDica(btn) {
  const dica = btn.closest('.exercicio-body').querySelector('.dica');
  dica.style.display = dica.style.display === 'block' ? 'none' : 'block';
}

function toggleResposta(btn) {
  const numero = btn.dataset.numero;
  const resp = document.querySelector(`[data-resp-numero="${numero}"]`);
  resp.style.display = resp.style.display === 'block' ? 'none' : 'block';
}

function resetar(numero) {
  const ex = exercicios.find(e => e.numero === numero);
  const textarea = document.querySelector(`.editor[data-numero="${numero}"]`);
  textarea.value = ex.codigo;
  textarea.classList.remove('correto', 'errado');
  const feedback = document.querySelector(`.feedback[data-numero="${numero}"]`);
  feedback.style.display = 'none';
}

function executarCodigo(codigo) {
  var saida = [];
  var maxLogs = 200;
  var logCount = 0;

  var fakeConsole = {
    log: function() {
      if (logCount >= maxLogs) return;
      logCount++;
      var args = [];
      for (var i = 0; i < arguments.length; i++) {
        var val = arguments[i];
        if (val === undefined) args.push("undefined");
        else if (val === null) args.push("null");
        else if (Array.isArray(val)) args.push(val.toString());
        else args.push(String(val));
      }
      saida.push(args.join(' '));
    }
  };

  try {
    var fn = new Function('console', codigo);
    fn(fakeConsole);
    return { sucesso: true, saida: saida.join('\n') };
  } catch (e) {
    return { sucesso: false, saida: '', erro: e.message };
  }
}

function validar(numero) {
  const ex = exercicios.find(e => e.numero === numero);
  const textarea = document.querySelector(`.editor[data-numero="${numero}"]`);
  const feedback = document.querySelector(`.feedback[data-numero="${numero}"]`);
  const exercicioDiv = document.querySelector(`.exercicio[data-numero="${numero}"]`);
  const tentativasSpan = document.querySelector(`.tentativas[data-numero="${numero}"]`);
  const btnResposta = document.querySelector(`.btn-resposta[data-numero="${numero}"]`);

  if (exercicioDiv.classList.contains('resolvido')) {
    feedback.className = 'feedback sucesso';
    feedback.innerHTML = '&#10004; Voce ja resolveu este exercicio!';
    feedback.style.display = 'block';
    return;
  }

  var codigoAluno = textarea.value.trim();
  var codigoBugado = ex.codigo.trim();

  if (codigoAluno === codigoBugado) {
    feedback.className = 'feedback erro';
    feedback.innerHTML = '&#10060; Voce ainda nao alterou o codigo! Encontre o bug e corrija.';
    feedback.style.display = 'block';
    textarea.classList.remove('correto');
    textarea.classList.add('errado');
    return;
  }

  var resultado = executarCodigo(codigoAluno);

  tentativasPorEx[numero]++;
  tentativasSpan.textContent = 'Tentativas: ' + tentativasPorEx[numero];

  if (!resultado.sucesso) {
    feedback.className = 'feedback erro';
    feedback.innerHTML = '&#10060; <b>Erro ao executar:</b> ' + escapeHtml(resultado.erro);
    feedback.style.display = 'block';
    textarea.classList.remove('correto');
    textarea.classList.add('errado');
  } else if (resultado.saida.trim() === ex.saidaEsperada.trim()) {
    feedback.className = 'feedback sucesso';
    feedback.innerHTML = '&#10004; <b>Correto!</b> Bug corrigido com sucesso!';
    feedback.style.display = 'block';
    textarea.classList.remove('errado');
    textarea.classList.add('correto');
    exercicioDiv.classList.add('resolvido');
    exercicioDiv.querySelector('.status-icon').innerHTML = '&#9745;';
    resolvidos++;
    resolvidosEl.textContent = resolvidos;
    btnResposta.style.display = 'inline-block';
  } else {
    feedback.className = 'feedback erro';
    var msg = '&#10060; <b>Saida incorreta.</b>\n\n';
    msg += '<b>Sua saida:</b>\n' + (resultado.saida === '' ? '<em>(vazio)</em>' : escapeHtml(resultado.saida)) + '\n\n';
    msg += '<b>Esperado:</b>\n' + (ex.saidaEsperada === '' ? '<em>(vazio)</em>' : escapeHtml(ex.saidaEsperada));
    feedback.innerHTML = msg;
    feedback.style.whiteSpace = 'pre-wrap';
    feedback.style.display = 'block';
    textarea.classList.remove('correto');
    textarea.classList.add('errado');
  }

  // Show answer button after 3 failed attempts
  if (tentativasPorEx[numero] >= 3 && !exercicioDiv.classList.contains('resolvido')) {
    btnResposta.style.display = 'inline-block';
  }
}
</script>
